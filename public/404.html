<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Karen Pinel — Psychologue</title>
    <script>
      // Redirection SPA standard GitHub Pages :
      // GitHub Pages sert 404.html pour toute route inconnue. On stocke
      // l'URL demandée en sessionStorage, puis on retourne à la racine du
      // site (index.html) qui la restaure via history.replaceState.
      (function () {
        var base = "/whisper-weave-care/";
        var path = window.location.pathname;
        // Sécurité anti-boucle : ne rediriger que si on est sur une
        // sous-route inconnue, jamais depuis la racine elle-même.
        if (path.indexOf(base) !== 0 || path === base || path === base + "index.html") {
          return;
        }
        var rest = path.slice(base.length - 1); // conserve le "/" initial
        rest += window.location.search + window.location.hash;
        try {
          sessionStorage.setItem("spa-redirect", rest);
        } catch (e) {
          return;
        }
        window.location.replace(base);
      })();
    </script>
  </head>
  <body>
    <p>Chargement de la page…</p>
    <a href="/whisper-weave-care/">Karen Pinel — Psychologue</a>
  </body>
</html>
